// 晶圆高亮：只用材质自发光（不再画光环——用户反馈那个蓝色呼吸圆环看着像模型错误，已删）
let waferHighlightOn = true;
function updateWaferHighlight(delta) {
  if (!waferHighlightOn || !waferMeshes || !waferMeshes.length) return;
  // 晶圆本体：青蓝自发光呼吸，一眼就能在机台里找到它在哪
  const t = performance.now() / 1000;
  const k = 0.16 + 0.10 * Math.abs(Math.sin(t * 1.8));
  for (const m of waferMeshes) {
    if (!m || !m.material) continue;
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    for (const mt of mats) {
      if (!mt || !mt.emissive) continue;
      if (mt.userData.waferEmissiveBase === undefined) mt.userData.waferEmissiveBase = mt.emissive.getHex();
      mt.emissive.setHex(0x3f86b0);
      mt.emissiveIntensity = k;
    }
  }
}

// 顶部三段机床报警灯（从下往上：红=宕机 / 黄=报警 / 绿=正常运行）
// 依据用户要求：所有“弹窗式提示”删除，机台状态只由这盏灯 + 操作电脑屏幕反映
function updateTowerLight() {
  const g = towerLamps['绿'], y = towerLamps['黄'], r = towerLamps['红'];
  if (!g && !y && !r) return;
  const t = performance.now() / 1000;
  const set = (mesh, inten) => {
    if (!mesh || !mesh.material) return;
    const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    for (const m of mats) { if (m && 'emissiveIntensity' in m) m.emissiveIntensity = inten; }
  };
  if (!powerOn) {                     // 断电：全暗
    set(g, 0.02); set(y, 0.02); set(r, 0.02);
    return;
  }
  if (machineDown) {                  // 宕机：红闪
    set(g, 0.03); set(y, 0.03);
    set(r, 0.6 + 3.6 * (Math.sin(t * 7.5) > 0 ? 1 : 0.05));
    return;
  }
  if (warnInfo) {                     // 小故障报警：黄闪（停传片、等操作员调参）
    set(g, 0.05);
    set(y, 0.5 + 3.0 * (Math.sin(t * 5.0) > 0 ? 1 : 0.08));
    set(r, 0.03);
    return;
  }
  set(y, 0.03); set(r, 0.03);         // 正常运行：绿呼吸
  set(g, 1.1 + 1.5 * Math.abs(Math.sin(t * 1.6)));
}

// 构建检修路线（m12097③：入场→看电脑→关电闸→开门→进机台→检修→退出→关门→离场）
function buildRepairRoute() {
  const V = (x, z) => new THREE.Vector3(x, 0, z);
  return [
    // 入场：从右前角入口进入（避开休息区桌椅）
    { pos: V(6.0, 4.5),     dur: 0,   act: 'enter',    label: 'EE-01 从更衣室进入洁净间…', face: -Math.PI*0.75 },
    // 沿右侧通道走向机台（x=4.0 通道，避开立柜在 x=5.0 z=-3.5）
    { pos: V(4.0, 2.0),     dur: 2.5, act: 'walk',     label: 'EE-01 前往机台区域', face: -Math.PI*0.5 },
    // 转向机台前方
    { pos: V(2.0, 0.5),     dur: 1.5, act: 'walk',     label: 'EE-01 接近操作电脑', face: Math.PI },
    // 到操作电脑前查看报错
    { pos: V(0.43, 0.45),   dur: 1.0, act: 'look',     label: 'EE-01 查看操作电脑报错…', face: Math.PI, wait: 2.5 },
    // 走到配电柜（右前方）
    { pos: V(0.80, 0.40),   dur: 1.0, act: 'lever',    label: 'EE-01 关闭配电柜电闸', face: Math.PI, wait: 1.5 },
    // 走到外壳门前（正面中央）
    { pos: V(0.0, 0.55),    dur: 1.2, act: 'door',     label: 'EE-01 打开外壳门', face: Math.PI, wait: 1.2 },
    // 进入机台内部
    { pos: V(0.0, 0.15),    dur: 1.0, act: 'enter_m',  label: 'EE-01 进入机台内部', face: Math.PI, wait: 0.5 },
    // 蹲下检修 10 秒
    { pos: V(0.0, 0.15),    dur: 0,   act: 'repair',   label: 'EE-01 检修中… 剩余 10 秒', face: Math.PI, wait: 10 },
    // 退出机台
    { pos: V(0.0, 0.55),    dur: 1.0, act: 'exit_m',   label: 'EE-01 退出机台', face: Math.PI, wait: 0.5 },
    // 关闭外壳门
    { pos: V(0.0, 0.55),    dur: 0,   act: 'closedoor',label: 'EE-01 关闭外壳门', face: Math.PI, wait: 1.2 },
    // 沿前方通道走向右侧（避开工具车在 x=-2.0 z=1.8）
    { pos: V(2.0, 1.5),     dur: 1.5, act: 'walk',     label: 'EE-01 离开机台区域', face: -Math.PI*0.5 },
    // 沿右侧通道走向出口（避开休息区在 x=5.0 z=4.0）
    { pos: V(4.0, 3.0),     dur: 1.5, act: 'walk',     label: 'EE-01 前往出口', face: -Math.PI*0.75 },
    // 离开场地
    { pos: V(6.0, 4.5),     dur: 2.0, act: 'leave',    label: 'EE-01 离开场地（电闸未合，需手动通电）', face: -Math.PI*0.75 },
  ];
}

function startEngineerRoute(route) {
  const g = ensureEngineer();
  g.visible = true;
  g.position.copy(route[0].pos);
  g.rotation.y = route[0].face || 0;
  engRoute = { route, idx: 0, t: 0, walk: 0, waitTimer: 0, repairCountdown: 10, waitLabel: route[0].label };
  engState = 'moving';
  const u = g.userData;
  u.legL.rotation.x = 0; u.legR.rotation.x = 0;
  u.armL.rotation.x = 0; u.armR.rotation.x = 0;
  u.torso.rotation.x = 0; u.cap.position.y = 0.50;
  if (u.calfL) u.calfL.rotation.x = 0; if (u.calfR) u.calfR.rotation.x = 0;
  if (u.foreL) u.foreL.rotation.x = 0; if (u.foreR) u.foreR.rotation.x = 0;
  g.position.y = 0;
}

function updateEngineer(delta) {
  const g = engineer;
  if (!g || !g.visible || !engRoute) return;
  const u = g.userData;
  const R = engRoute;
  const route = R.route;

  if (engState === 'moving') {
    const nxt = route[R.idx + 1];
    if (!nxt) {
      engState = 'off'; g.visible = false; engRoute = null;
      u.legL.rotation.x = 0; u.legR.rotation.x = 0;
      u.armL.rotation.x = 0; u.armR.rotation.x = 0; u.torso.rotation.x = 0;
      if (u.calfL) u.calfL.rotation.x = 0; if (u.calfR) u.calfR.rotation.x = 0;
      if (u.foreL) u.foreL.rotation.x = 0; if (u.foreR) u.foreR.rotation.x = 0;
      g.position.y = 0;
      return;
    }
    const cur = route[R.idx];
    if (nxt.dur > 0) {
      R.t += delta / nxt.dur;
      const tt = Math.min(1, R.t);
      const e = tt * tt * (3 - 2 * tt);           // smoothstep
      g.position.lerpVectors(cur.pos, nxt.pos, e);
      const dir = nxt.pos.clone().sub(cur.pos);
      if (dir.lengthSq() > 0.001) g.rotation.y = Math.atan2(dir.x, dir.z);
      R.walk += delta * 9.0;
      const sw = Math.sin(R.walk);
      const swAbs = Math.abs(sw);
      // 大腿前后摆动
      u.legL.rotation.x = sw * 0.50;
      u.legR.rotation.x = -sw * 0.50;
      // 膝关节弯曲：腿向前时小腿向后弯，腿向后时小腿伸直
      if (u.calfL) u.calfL.rotation.x = Math.max(0, sw) * 0.65 + 0.05;
      if (u.calfR) u.calfR.rotation.x = Math.max(0, -sw) * 0.65 + 0.05;
      // 手臂前后摆动（与腿反向）
      u.armL.rotation.x = -sw * 0.38;
      u.armR.rotation.x = sw * 0.38;
      // 肘关节微弯
      if (u.foreL) u.foreL.rotation.x = 0.25 + swAbs * 0.15;
      if (u.foreR) u.foreR.rotation.x = 0.25 + swAbs * 0.15;
      // 身体上下浮动（步伐节奏）
      u.torso.rotation.x = 0; u.cap.position.y = 0.50 - swAbs * 0.012;
      g.position.y = -swAbs * 0.008;
      if (R.t >= 1) { _engArrive(nxt); }
    } else {
      _engArrive(nxt);
    }
  } else if (engState === 'waiting') {
    R.waitTimer -= delta;
    const t = performance.now() / 1000;
    if (R.waitAct === 'look') {
      u.torso.rotation.x = 0.08;
      u.armR.rotation.x = -0.3 + Math.sin(t * 2) * 0.15;
      u.legL.rotation.x = 0; u.legR.rotation.x = 0; u.armL.rotation.x = 0;
    } else if (R.waitAct === 'lever') {
      u.armR.rotation.x = -0.8 + Math.sin(t * 4) * 0.2;
      u.torso.rotation.x = 0.12;
      u.legL.rotation.x = 0; u.legR.rotation.x = 0; u.armL.rotation.x = 0;
    } else if (R.waitAct === 'repair') {
      R.repairCountdown -= delta;
      const sec = Math.max(0, Math.ceil(R.repairCountdown));
      R.waitLabel = 'EE-01 检修中（开腔 / 更换模块 / 复位联锁）… 剩余 ' + sec + ' 秒';
      const s = Math.sin(t * 3.2);
      // 蹲姿：身体下沉 + 躯干前倾 + 膝关节深弯
      g.position.y = -0.08;
      u.torso.rotation.x = 0.35 + s * 0.05;
      u.cap.position.y = 0.50 - 0.08;
      // 膝盖弯曲（大腿水平+小腿垂直）
      u.legL.rotation.x = 0.85; u.legR.rotation.x = 0.85;
      if (u.calfL) u.calfL.rotation.x = -1.2;
      if (u.calfR) u.calfR.rotation.x = -1.2;
      // 双臂伸向机台交替挥动
      u.armR.rotation.x = -1.35 + s * 0.35;
      u.armL.rotation.x = -0.75 + s * 0.22;
      if (u.foreR) u.foreR.rotation.x = 0.40 + Math.abs(s) * 0.20;
      if (u.foreL) u.foreL.rotation.x = 0.30 + Math.abs(s) * 0.15;
      u.cap.position.y = 0.50 - 0.05 - Math.abs(s) * 0.01;
      u.legL.rotation.x = 0.22; u.legR.rotation.x = 0.22;
    } else {
      u.legL.rotation.x = 0; u.legR.rotation.x = 0;
      u.armL.rotation.x = 0; u.armR.rotation.x = 0;
      u.torso.rotation.x = 0; u.cap.position.y = 0.50;
    }
    if (R.waitTimer <= 0) {
      engState = 'moving'; R.t = 0;
      u.legL.rotation.x = 0; u.legR.rotation.x = 0;
      u.armL.rotation.x = 0; u.armR.rotation.x = 0;
      u.torso.rotation.x = 0; u.cap.position.y = 0.50;
      if (u.calfL) u.calfL.rotation.x = 0; if (u.calfR) u.calfR.rotation.x = 0;
      if (u.foreL) u.foreL.rotation.x = 0; if (u.foreR) u.foreR.rotation.x = 0;
      g.position.y = 0;
    }
  }
}

// 工程师到达 waypoint 后的动作分发
function _engArrive(nxt) {
  const g = engineer, R = engRoute, u = g.userData;
  g.position.copy(nxt.pos);
  g.rotation.y = nxt.face || 0;
  R.t = 0; R.idx++;
  if (nxt.act === 'lever') { if (powerOn) togglePower(); }    // 关电闸
  if (nxt.act === 'door') { shellTarget = 1; }                 // 开外壳门
  if (nxt.act === 'closedoor') { shellTarget = 0; }            // 关外壳门
  if (nxt.wait) {
    engState = 'waiting';
    R.waitTimer = nxt.wait; R.waitAct = nxt.act; R.waitLabel = nxt.label;
    if (nxt.act === 'repair') R.repairCountdown = 10;
  }
}

// 兼容旧 API
function startEngineer(state) {
  if (!state || state === 'off') {
    engState = 'off'; if (engineer) engineer.visible = false; engRoute = null;
  }
}

// ====== 宕机 → 呼叫设备工程师 → 检修完成 → 重新调束+试片 ======
// 宕机提示全部显示在「操作电脑屏幕」的操作页里（不再用独立窗口）
function handleMachineDown(reason) {
  if (machineDown) return;
  machineDown = true;
  downReason = reason || '设备异常';
  repairPhase = '待处理：请呼叫设备工程师';
  const wasRunning = processRunning;
  if (processRunning) stopProcess(true);
  beamOn = false;
  // 宕机后必须重新走「调束 → 试片」流程才能复产
  tuneDone = false; pilotPassed = false; pilotInfo = null; retuneCount = 0;
  updatePilotUI(); updateBeamButton();
  screenRefresh();          // 立即把宕机状态推到屏幕上
  showToast((wasRunning ? '⚠ 工艺中断：' : '⚠ ') + '机台宕机 — ' + downReason + '（见操作电脑屏幕，点「呼叫设备工程师」）');
}

// 呼叫工程师：派工 → 工程师走进机台（3D 里真的有人） → 轮询机台真实状态 → 修好才解除宕机
function sleepMs(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function callEngineer() {
  if (repairBusy) return;
  if (!machineDown) return;
  repairBusy = true;
  let ok = false, tries = 0, resp = null;
  // 构建分段检修路线并启动（m12097③：入场→看电脑→关电闸→开门→进机台→检修→退出→关门→离场）
  const route = buildRepairRoute();
  startEngineerRoute(route);
  // 等待路线完成，同步 repairPhase 到操作电脑屏幕
  while (engState !== 'off') {
    if (engRoute) {
      if (engRoute.waitLabel) repairPhase = engRoute.waitLabel;
      else { const nxt = engRoute.route[engRoute.idx + 1]; if (nxt) repairPhase = nxt.label; }
    }
    screenRefresh();
    await sleepMs(200);
  }
  repairPhase = 'EE-01 检修作业完成，正在复位联锁…';
  screenRefresh();
  while (!ok && tries < 3) {
    tries++;
    try {
      const r = await fetch('/api/repair', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ engineer: 'EE-01' }) });
      resp = await r.json();
      ok = !!resp.ok;
    } catch (e) { ok = false; }
    if (!ok) { await sleepMs(600); }
  }
  if (!ok) {
    repairBusy = false;
    repairPhase = '✘ 派工失败：MQTT 未连通或模拟器未运行（先双击启动离子注入网站.bat）';
    screenRefresh();
    return;
  }
  // 后端已经在 /api/repair 里等到状态变化；这里再兜底轮询一次（最多 20 秒）
  let real = !!(resp && resp.state && resp.state !== 'DOWN');
  for (let i = 0; !real && i < 20; i++) {
    await sleepMs(1000);
    try {
      const k = await (await fetch('/api/kpis')).json();
      if (k.machine_state && k.machine_state !== 'DOWN') { real = true; break; }
    } catch (e) {}
  }
  repairBusy = false;
  if (!real) {
    repairPhase = '✘ 检修未完成：模拟器未回到 IDLE（检查 to_db / simulator 是否在线）';
    screenRefresh();
    return;
  }
  machineDown = false;
  downReason = '';
  repairPhase = '✔ 检修完成 — 请重新通电 → 调束 → 试片（电闸未合，需手动通电）';
  sendMachineCmd('stop');   // 检修后机台停转，等待重新调束/试片
  updatePilotUI(); screenRefresh();
}

function toggleFastDemo() {
  lotCycle.fast = !lotCycle.fast;
  const b = document.getElementById('btn-fast');
  if (b) { b.textContent = '快速演示: ' + (lotCycle.fast ? '开' : '关'); b.classList.toggle('active', lotCycle.fast); }
  showToast(lotCycle.fast ? '⚡ 快速演示：时间轴 ×8（约 2.2 秒/片）' : '正常节奏：时间轴 ×1.5（约 11.7 秒/片）');
}

function updateCycleUI() {
  const ps = document.getElementById('process-status');
  if (!ps || !processRunning) return;
  if (lotCycle.active) {
    ps.innerHTML = '<span class="dot"></span>工艺: 运行中 · 第 ' + Math.min(lotCycle.done + 1, lotCycle.total) + '/' + lotCycle.total + ' 片' + (lotCycle.fast ? ' · 快速' : '');
  }
}

/* ===== 批次与节拍（修 #1 双时钟 / #2 批次统计 / #3 lot_id / #12 重新装盒）=====
   画面 11.67 s/片，而模拟器默认 5 s/片 → 数据库产量与动画永远对不上。
   现在改为「网页驱动节拍」：网页每走完 1 片，才让模拟器产出这 1 片（emit），
   数据库与画面严格 1:1；停机时网页不再 emit，产量自然冻结。 */
let currentLotId = null;
let processPaused = false;
let warnInfo = null;
let ackBusy = false;

async function startLot() {
  try {
    const r = await fetch('/api/lot/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ total: lotCycle.total })
    });
    const d = await r.json();
    if (d.ok) { currentLotId = d.lot_id; lotCycle.boxOpen = true; console.log('[lot] 开工批次', d.lot_id); }
    else showToast('⚠ 批次开工指令下发失败（模拟器/EMQX 离线？）');
  } catch (e) { showToast('⚠ 批次开工失败: ' + e.message); }
}

async function emitWafer(seq) {
  try {
    await fetch('/api/wafer/emit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lot_id: currentLotId, seq: seq })
    });
    fetchKpis();          // 每片完成立刻同步 KPI 与屏幕（不再等 5 s 轮询）
    screenRefresh();
  } catch (e) { /* 离线不打断动画 */ }
}

function togglePause() {
  if (!processRunning) { showToast('⚠ 工艺未启动，无需暂停'); return; }
  processPaused = !processPaused;
  if (processPaused) {
    mixer.timeScale = 0;
    sendMachineCmd('stop');      // 暂停即停产出（数据库数量冻结）
    beamOn = false; updateBeamButton();
    showToast('⏸ 工艺已暂停（束流关、传片停、产量冻结）');
  } else {
    mixer.timeScale = lotCycle.fast ? 8 : 1.5;
    beamOn = true; updateBeamButton();
    sendMachineCmd('run', currentLotId);
    showToast('▶ 工艺已继续');
  }
  const ps = document.getElementById('process-status');
  if (ps) ps.innerHTML = '<span class="dot"></span>工艺: ' + (processPaused ? '已暂停' : '运行中（传片→注入）');
  screenRefresh();
}

async function reloadBox() {
  try { await fetch('/api/lot/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); } catch (e) {}
  currentLotId = null;
  processPaused = false;
  warnInfo = null;
  lotCycle.active = false; lotCycle.boxOpen = false; lotCycle.done = 0; lotCycle.report = null;
  stopProcess(true);
  tuneDone = false; pilotPassed = false; pilotInfo = null; retuneCount = 0;
  machineDown = false; repairPhase = ''; downReason = '';
  if (powerOn) togglePower();          // 回到「未通电」初始态：必须重新上电→调束→试片
  closeStopReport();
  updatePilotUI(); updateTuneUI && updateTuneUI(); screenRefresh();
  showToast('📦 已重新装盒：换上满盒 20 片，请重新上电 → 调束 → 试片');
}

// ===== 手动词调参流程（用户要求：不能一键“参数已调整”，必须走三步）=====
// ① 确认报警内容 → ② 在「工序参数」页找到该参数并点「调整」→ ③ 回「操作」页点「启动工艺」
let pendingParam = null;   // {alarm_code, component_tag, param_name, param_from, param_to, param_unit, adjusted}

function confirmWarn() {
  const w = warnInfo;
  if (!w) return;
  pendingParam = {
    alarm_id: w.id || null,
    alarm_code: w.alarm_code || '',
    component_tag: w.component_tag || '',
    param_name: w.param_name || '工艺参数',
    param_from: (w.param_from != null ? w.param_from : '—'),
    param_to: (w.param_to != null ? w.param_to : '—'),
    param_unit: w.param_unit || '',
    param_fix: w.param_fix || '',
    adjusted: false,
  };
  // 自动切到「工序参数」页，操作员在这里找参数并点调整
  try { if (screenUI && screenUI.setPage) screenUI.setPage('param'); } catch (e) {}
  screenRefresh();
}

async function adjustParam() {
  if (!pendingParam || pendingParam.adjusted || ackBusy) return;
  ackBusy = true; screenRefresh();
  try {
    // ④A：只关这一条报警（告 id 优先，退化为 alarm_code），不再一次关掉所有 WARN
    const body = { alarm_id: pendingParam.alarm_id || null, alarm_code: pendingParam.alarm_code || '' };
    const r = await fetch('/api/alarm/ack', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.ok) {
      pendingParam.adjusted = true;
      pendingParam.closed = d.closed || 0;
      warnInfo = null;
      // 不自动恢复时间轴：按用户流程，需回「操作」页主动点「启动工艺」
    }
  } catch (e) { /* 离线不打断 */ }
  ackBusy = false;
  setTimeout(pollWarn, 600);
  screenRefresh();
}

// 报警轮询：小故障（WARN）→ 屏幕里显示「哪台部件 / 哪个参数 / 从多少调到多少」+ 继续按钮
async function pollWarn() {
  try {
    const r = await fetch('/api/alarms/open');
    const rows = await r.json();
    const w = (rows || []).find(x => x.alarm_level === 'WARN');
    warnInfo = w || null;
    if (w && processRunning && !processPaused && !probeMode) {
      mixer.timeScale = 0;   // 报警即停止传片（不停机），等操作员按向导调参
      processRunning = false; // 调参后必须由操作员重新点「启动工艺」（用户要求手动流程）
      const pb = document.getElementById('btn-process');
      if (pb) { pb.textContent = '▶ 启动工艺'; pb.classList.remove('running'); }
      const ps = document.getElementById('process-status');
      if (ps) ps.innerHTML = '<span class="dot"></span>工艺: 报警拦截（' + (w.component_tag || '部件') + ' 待调参）';
    }
  } catch (e) { /* 忽略 */ }
  screenRefresh();
}

// 停机报告：不再弹窗，数据进操作电脑屏幕「操作」页底部
let lotReport = null;
function showStopReport(r) {
  lotReport = r || null;
  window.__lotReport = lotReport;
  screenRefresh();
  // ⑨C：报告单独一页，跑完自动切过去；同时拉一次历史批次
  try { if (screenUI && screenUI.setPage) screenUI.setPage('rep'); } catch (e) {}
  loadLotRecords();
}

function closeStopReport() {
  lotReport = null; window.__lotReport = null; screenRefresh();
}

// ⑨C 历史批次：拉最近批次记录给「停机报告」页用（⑦A 默认已过滤归档的压测批次）
async function loadLotRecords() {
  try {
    const r = await fetch('/api/lot/records?limit=5');
    window.__lotRecords = await r.json();
  } catch (e) { window.__lotRecords = []; }
  screenRefresh();
}

async function finishLotCycle() {
  lotCycle.active = false;
  lotCycle.boxOpen = false;     // 整盒 20/20 完成 → 关盒，等下一次重新装盒
  stopProcess(true);
  showToast('✔ ' + lotCycle.total + ' 片工艺完成，机台自动停机');
  try {
    const r = await fetch('/api/lot/close', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ count: lotCycle.total, mode: lotCycle.fast ? 'FAST' : 'NORMAL', lot_id: currentLotId })
    });
    const d = await r.json();
    lotCycle.report = d;
    showStopReport(d);
  } catch (e) { showToast('✘ 停机报告生成失败: ' + e.message); }
}

function toggleProcess() {
  if (processRunning) { stopProcess(false); return; }
  if (!powerOn) { showToast('⚠ 请先通电，再启动工艺'); return; }
  if (machineDown) { showToast('⚠ 机台宕机中，请先呼叫设备工程师检修'); return; }
  if (!doorsClosed()) { showToast('⚠ 安全联锁：柜门未关闭，无法启动工艺'); return; }
  if (!mixerReady) { showToast('⚠ 动画尚未就绪，请稍候'); return; }
  if (!tuneDone) { showToast('⚠ 请先在操作电脑上完成「🔧 调束」'); return; }
  if (!pilotPassed) { showToast('⚠ 未试片或试片不合格：请先完成试片（合格后才能开工）'); return; }
  // ③A 报警门禁：有未处理 WARN 时不许启动工艺（否则动画在跑、模拟器被拦着不产片，画面与库里 1:1 断开）
  if (warnInfo) {
    showToast('⚠ 有未处理报警：请先在操作电脑上「确认报警 → 调参 → 调整」，再回来启动工艺');
    try { if (screenUI && screenUI.setPage) screenUI.setPage('act'); } catch (e) {}
    screenRefresh();
    return;
  }
  // 报警/暂停/宕机后复产：只要这一盒还没做完，就接着本盒继续（不换盒、不清零）
  const resume = lotCycle.boxOpen && lotCycle.done > 0 && lotCycle.done < lotCycle.total;
  lotCycle.active = true;
  if (!resume) { lotCycle.done = 0; }
  startProcess(resume);
}

function startProcess(resume) {
  processRunning = true;
  processPaused = false;
  if (!resume) { lastCycleIdx = 0; mixer.setTime(0); }
  else {
    // 接着本盒继续：时间轴对齐到「已完成 done 片」的循环起点，避免画面从第 1 片重放
    const tAt = lotCycle.done * CYCLE_S;
    try { mixer.timeScale = 1; mixer.setTime(tAt); mixer.timeScale = 0; } catch (e) {}
    lastCycleIdx = lotCycle.done;
  }
  // 启动工艺后先不传片：必须再点「启动束流」，束流起才让时间轴走动
  mixer.timeScale = 0;
  beamOn = false;
  const btn = document.getElementById('btn-process');
  btn.textContent = '⏸ 停止工艺';
  btn.classList.add('running');
  const ps = document.getElementById('process-status');
  ps.className = 'run';
  ps.innerHTML = '<span class="dot"></span>工艺: 已启动 · 等待启动束流（点「束流 OFF→ON」开始传片）';
  updateBeamButton();
  updateCycleUI();
  startBeamFollow();
  if (!resume) startLot();   // 生成本盒批次号并下发模拟器（整盒共用，修 #3 lot_id 泛滥）
}

function stopProcess(silent) {
  processRunning = false;
  beamOn = false;
  lotCycle.active = false;
  mixer.timeScale = 0;
  // 盒子还没做完时不清零时间轴：保留当前片的位置，复产时接着这一盒继续
  if (!lotCycle.boxOpen) mixer.setTime(0);
  sendMachineCmd('stop');   // 停机 → 模拟器暂停产出（DB 晶圆数量冻结）
  const btn = document.getElementById('btn-process');
  btn.textContent = '▶ 启动工艺';
  btn.classList.remove('running');
  const ps = document.getElementById('process-status');
  ps.className = '';
  ps.innerHTML = '<span class="dot"></span>工艺: 待机';
  updateBeamButton();
  stopBeamFollow(false, true);
  if (!silent) showToast('工艺已停止');
}

// ====== 束流开关（需通电 + 已启动工艺）======
// 启动束流 → 时间轴开始走动（机械手/晶圆开始传片）并通知模拟器开产
function toggleBeam() {
  if (!powerOn) { showToast('⚠ 束流需要通电后才能启动'); return; }
  if (machineDown) { showToast('⚠ 机台宕机中，请先呼叫设备工程师检修'); return; }
  if (!processRunning) { showToast('⚠ 请先启动工艺，再启动束流'); return; }
  beamOn = !beamOn;
  if (beamOn) {
    mixer.timeScale = lotCycle.fast ? 8 : 1.5;
    sendMachineCmd('run');
    const ps = document.getElementById('process-status');
    if (ps) ps.innerHTML = '<span class="dot"></span>工艺: 运行中（传片→注入）';
    showToast('⚡ 束流已启动 — 开始传片与离子注入');
  } else {
    mixer.timeScale = 0;
    sendMachineCmd('stop');
    const ps = document.getElementById('process-status');
    if (ps) ps.innerHTML = '<span class="dot"></span>工艺: 已暂停（束流关闭，传片暂停）';
    showToast('束流已关闭 — 传片暂停');
  }
  updateBeamButton();
}

function updateBeamButton() {
  const b = document.getElementById('btn-beam');
  if (b) {
    b.textContent = beamOn ? '束流 ON' : '束流 OFF';
    b.classList.toggle('beam-on', beamOn);
  }
  // 束流关闭时把束流网格整段隐藏：否则它们在机台里显示成「一块块黑色零件」
  setBeamVisible(beamOn || beamFocus);
}

// 束流网格显隐（关束流时隐藏，避免黑块；束流聚焦时强制显示）
function setBeamVisible(on) {
  for (const e of beamMeshes) {
    if (e.mesh) e.mesh.visible = !!on;
    if (on && e.mat) e.mat.emissiveIntensity = Math.max(e.mat.emissiveIntensity, e.baseIntensity * 0.55);
  }
}

// ================= ① 束流聚焦 B：去色压暗 + 流动粒子 =================
let beamFocus = false;
let beamCurve = null, beamParticles = null, particleT = 0;
const PARTICLE_N = 240;
const particleJitter = [];
const desatSaved = new Map();          // 材质 -> 原始 color / emissive / ei

function collectRenderMeshes() {
  const out = [];
  for (const o of allMeshes) if (o && o.isMesh) out.push(o);
  if (addEnvGroup) addEnvGroup.traverse(o => { if (o.isMesh) out.push(o); });
  return out;
}

// 束流的真实流序（离子源 → 磁铁 90°弧 → 加速管 → 扫描器 → 平行分化器 → 宽带 → 晶圆光斑）
// 关键修正（2026-10-30）：
//   ① 磁铁弧段编号是「出射=0 → 入射=15」，必须倒序走，否则入口出口反了；
//   ② 长构件（束流_笔状_加速管 0.37 m）不能用网格中心当路点，否则会先窜到管子中段再跳回入口管段，
//      所以每个构件都取「沿流方向的两个端面中心」，按入口→出口顺序压入路径。
// axis：'-Z' = Blender +Y（离子源→磁铁）；'+X' = Blender +X（管/扫描器/分化器）；'+Z' = Blender −Y（宽带→晶圆）
// 每个构件只取「沿流方向的两个端面中心」。重叠的粗束流毛坯（束流_笔状_加速管 0.37 m、
// 扫描器_束流 与 束流_展开_扫描器 同心）只保留其中最贴合真实束流的一个，否则路径会先冲到下游再跳回来。
const BEAM_FLOW = [
  { re: /^束流_笔状_离子源到磁铁$/,         axis: '-Z', sort: 'none' },
  { re: /^磁铁_束流_(\d+)$/,              axis: 'arc', sort: 'desc' },   // 15 → 0（入射 → 出射）
  { re: /^加速管_束流$/,                  axis: '+X', sort: 'none' },
  { re: /^束流_展开_扫描器$/,              axis: '+X', sort: 'none' },
  { re: /^束流_展开_扫描器到分化器$/,        axis: '+X', sort: 'none' },
  { re: /^平行分化器_束流_(\d+)$/,          axis: '+X', sort: 'asc' },
  { re: /^束流_宽带_分化器到晶圆$/,         axis: '+Z', sort: 'none' },
  { re: /^束流_晶圆光斑$/,                 axis: '+Z', sort: 'none' },
];

window.__beamPath = null;

// 由束流网格按「真实流序 + 沿流方向端面」排出整条束流路径
function buildBeamPathCurve() {
  const bucket = (name) => {
    for (let gi = 0; gi < BEAM_FLOW.length; gi++) {
      if (BEAM_FLOW[gi].re.test(name)) return gi;
    }
    return -1;
  };
  const items = [];
  for (const e of beamMeshes) {
    const m = e.mesh; if (!m) continue;
    m.updateWorldMatrix(true, false);
    const bb = new THREE.Box3().setFromObject(m);
    if (bb.isEmpty()) continue;
    const gi = bucket(m.name || '');
    const num = parseInt((String(m.name).match(/_(\d+)$/) || [0, 1e6])[1], 10);
    items.push({ gi, num, bb, name: m.name, axis: gi >= 0 ? BEAM_FLOW[gi].axis : null });
  }
  items.sort((a, b) => {
    if (a.gi !== b.gi) return a.gi - b.gi;
    const s = BEAM_FLOW[a.gi] && BEAM_FLOW[a.gi].sort;
    if (s === 'desc') return b.num - a.num;
    if (s === 'asc') return a.num - b.num;
    return 0;
  });
  const ordered = [];
  const push = (p) => {
    if (!ordered.length || ordered[ordered.length - 1].distanceToSquared(p) > 2.25e-6) ordered.push(p);
  };
  const seq = [];
  for (const it of items) {
    if (it.gi < 0) continue;
    const c = it.bb.getCenter(new THREE.Vector3());
    const mn = it.bb.min, mx = it.bb.max;
    seq.push(it.name);
    if (it.axis === '+X') {                       // 沿 +X 走：x 小 → x 大
      push(new THREE.Vector3(mn.x, c.y, c.z));
      push(new THREE.Vector3(mx.x, c.y, c.z));
    } else if (it.axis === '-Z') {                // Blender +Y = glTF −Z：z 大 → z 小
      push(new THREE.Vector3(c.x, c.y, mx.z));
      push(new THREE.Vector3(c.x, c.y, mn.z));
    } else if (it.axis === '+Z') {                // Blender −Y = glTF +Z：z 小 → z 大
      push(new THREE.Vector3(c.x, c.y, mn.z));
      push(new THREE.Vector3(c.x, c.y, mx.z));
    } else {                                      // 弧段：用中心点，靠 going-around 的密集点连成弧
      push(c);
    }
  }
  if (ordered.length < 2) return null;
  let maxGap = 0;
  for (let i = 1; i < ordered.length; i++) maxGap = Math.max(maxGap, ordered[i].distanceTo(ordered[i - 1]));
  window.__beamPath = {
    groups: BEAM_FLOW.length,
    matched: items.filter(i => i.gi >= 0).length,
    unmatched: items.filter(i => i.gi < 0).map(i => i.name),
    points: ordered.length,
    maxGap: +maxGap.toFixed(4),
    first: ordered[0].toArray().map(v => +v.toFixed(3)),
    last: ordered[ordered.length - 1].toArray().map(v => +v.toFixed(3)),
    span: +ordered[0].distanceTo(ordered[ordered.length - 1]).toFixed(3),
    order: seq,                                   // 供探针核对：磁铁段应是 磁铁_束流_15 … 磁铁_束流_0
  };
  // tension 很小 → 曲线贴着真实网格走，不会切角偏离束流
  return new THREE.CatmullRomCurve3(ordered, false, 'catmullrom', 0.05);
}

function buildBeamParticleStream() {
  if (!beamCurve) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PARTICLE_N * 3), 3));
  const mat = new THREE.PointsMaterial({
    color: 0xa8f0ff, size: 0.0055, sizeAttenuation: true,
    transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  pts.name = 'BEAM_PARTICLES';
  pts.frustumCulled = false;
  pts.visible = false;
  scene.add(pts);
  for (let i = 0; i < PARTICLE_N; i++) {
    particleJitter.push(new THREE.Vector3(
      (Math.random() - 0.5) * 0.012, (Math.random() - 0.5) * 0.012, (Math.random() - 0.5) * 0.012));
  }
  beamParticles = { points: pts, geo };
}

function setBeamFocus(on) {
  if (on === beamFocus) return;
  beamFocus = on;
  const btn = document.getElementById('btn-beamfocus');
  if (btn) { btn.textContent = on ? '束流聚焦: 开' : '束流聚焦: 关'; btn.classList.toggle('active', on); }
  if (on) {
    for (const o of collectRenderMeshes()) {
      const name = o.name || '';
      if (BEAM_RE.test(name) || WAFER_RE.test(name)) continue;
      const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      for (const m of mats) {
        if (!m) continue;
        if (!desatSaved.has(m)) {
          desatSaved.set(m, {
            c: m.color ? m.color.clone() : null,
            e: m.emissive ? m.emissive.clone() : null,
            ei: m.emissiveIntensity ?? 1
          });
        }
        if (m.color) {
          const g = m.color.r * 0.299 + m.color.g * 0.587 + m.color.b * 0.114;
          m.color.setRGB(g * 0.14, g * 0.16, g * 0.19);
        }
        if (m.emissive) {
          const ge = m.emissive.r * 0.3 + m.emissive.g * 0.6 + m.emissive.b * 0.1;
          m.emissive.setRGB(ge * 0.10, ge * 0.12, ge * 0.16);
        }
        m.needsUpdate = true;
      }
    }
    if (beamParticles) beamParticles.points.visible = true;
    // 束流聚焦：即使当前没开束流，也让真实束流网格发光显形（配合相机沿真实路径推进）
    setBeamVisible(true);
    for (const e of beamMeshes) {
      if (e.mat) e.mat.emissiveIntensity = Math.max(e.mat.emissiveIntensity, e.baseIntensity * 0.9);
      if (e.mesh) e.mesh.visible = true;
    }
  } else {
    for (const [m, s] of desatSaved) {
      if (s.c && m.color) m.color.copy(s.c);
      if (s.e && m.emissive) m.emissive.copy(s.e);
      m.emissiveIntensity = s.ei;
      m.needsUpdate = true;
    }
    desatSaved.clear();
    if (beamParticles) beamParticles.points.visible = false;
    setBeamVisible(beamOn);   // 退出聚焦：按当前束流状态恢复（关束流则继续隐藏黑块）
  }
}

function toggleBeamFocus() {
  if (!beamCurve) { showToast('束流路径尚未就绪'); return; }
  setBeamFocus(!beamFocus);
  showToast(beamFocus ? '束流聚焦：其它构件去色压暗，只留束流是彩色' : '束流聚焦已关闭');
}

function updateBeamParticles(delta) {
  if (!beamParticles || !beamParticles.points.visible || !beamCurve) return;
  particleT = (particleT + delta * 0.42) % 1;
  const arr = beamParticles.geo.attributes.position.array;
  for (let i = 0; i < PARTICLE_N; i++) {
    const t = ((i / PARTICLE_N) + particleT) % 1;
    const p = beamCurve.getPointAt(t);
    const j = particleJitter[i];
    arr[i * 3] = p.x + j.x;
    arr[i * 3 + 1] = p.y + j.y;
    arr[i * 3 + 2] = p.z + j.z;
  }
  beamParticles.geo.attributes.position.needsUpdate = true;
  beamParticles.points.material.opacity = 0.62 + 0.32 * Math.sin(clock.elapsedTime * 6);
}

// ================= ① 束流聚焦 C：镜头沿束流推轨 =================
let followOn = false, followActive = false, followT = 0, followDur = 7.0;

function startBeamFollow() {
  if (!followOn || !beamCurve || focusPart) return;
  followActive = true; followT = 0;
  controls.enabled = false;
  showToast('镜头跟随：离子源 → 磁铁 → 加速管 → 扫描器 → 分化器 → 靶室');
}

function stopBeamFollow(returnHome, silent) {
  if (!followActive) return;
  followActive = false;
  controls.enabled = true;
  if (returnHome) animateCamera(camHome, targetHome);
  if (!silent) showToast('镜头跟随结束');
}

function toggleFollow() {
  followOn = !followOn;
  const b = document.getElementById('btn-follow');
  if (b) { b.textContent = followOn ? '镜头跟随: 开' : '镜头跟随: 关'; b.classList.toggle('active', followOn); }
  if (!followOn) stopBeamFollow(false, true);
  showToast(followOn ? '启动工艺时镜头会自动跟随束流' : '已关闭镜头跟随');
}

function updateBeamFollow(delta) {
  if (!followActive || !beamCurve) return;
  followT = Math.min(1, followT + delta / followDur);
  const p = beamCurve.getPointAt(followT);
  const cp = p.clone().add(new THREE.Vector3(0, 0.135, 0.205));
  camera.position.lerp(cp, Math.min(1, delta * 5.5));
  controls.target.lerp(p, Math.min(1, delta * 5.5));
  camera.lookAt(controls.target);
  if (followT >= 1) {
    followActive = false;
    setTimeout(() => { controls.enabled = true; }, 700);
  }
}

// ================= ⑥ 单件聚焦：幽灵态 + 镜头特写 + 呼吸闪烁 =================
let focusPart = null;
const focusMatSaved = [];

function enterFocus(part) {
  if (!part || focusPart === part) return;
  if (focusPart) exitFocus(true);
  focusPart = part;
  selectedPart = part;

  // 幽灵态：其余构件压到 8%
  const keep = new Set();
  part.traverse(o => { if (o.isMesh) keep.add(o); });
  for (const o of collectRenderMeshes()) {
    if (keep.has(o)) continue;
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      if (!m) continue;
      if (!m.userData.ghostOrig) {
        m.userData.ghostOrig = { op: m.opacity, tr: m.transparent, dw: m.depthWrite };
      }
      m.transparent = true;
      m.opacity = 0.08;
      m.depthWrite = false;
      m.needsUpdate = true;
    }
  }

  // 呼吸发光
  focusMatSaved.length = 0;
  part.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      if (!m) continue;
      focusMatSaved.push({ m, e: m.emissive ? m.emissive.clone() : null, ei: m.emissiveIntensity ?? 1 });
      if (m.emissive) { m.emissive.setHex(0x2bd6ff); m.emissiveIntensity = 0.5; m.needsUpdate = true; }
    }
  });

  // 镜头特写（保持当前观察方向）
  const bb = new THREE.Box3().setFromObject(part);
  const ctr = bb.getCenter(new THREE.Vector3());
  const size = bb.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z, 0.03);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const dist = (maxDim / (2 * Math.tan(fov / 2))) * 2.1 + 0.05;
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0.6, 0.5, 0.9);
  dir.normalize();
  controls.minDistance = 0.04;
  window.__lastFocusDist = +dist.toFixed(3);
  animateCamera(ctr.clone().addScaledVector(dir, dist), ctr);
}

function exitFocus(silent) {
  if (!focusPart) return;
  for (const o of collectRenderMeshes()) {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) {
      const g = m && m.userData && m.userData.ghostOrig;
      if (!g) continue;
      m.opacity = g.op;
      m.transparent = g.tr;
      m.depthWrite = g.dw;
      m.needsUpdate = true;
      delete m.userData.ghostOrig;
    }
  }
  for (const s of focusMatSaved) {
    if (s.e && s.m.emissive) s.m.emissive.copy(s.e);
    s.m.emissiveIntensity = s.ei;
    s.m.needsUpdate = true;
  }
  focusMatSaved.length = 0;
  focusPart = null;
  applyTransparency();
  if (!silent) showToast('已退出单件聚焦');
}

function updateFocusBreath() {
  if (!focusPart || !focusMatSaved.length) return;
  const k = 0.30 + 0.50 * (0.5 + 0.5 * Math.sin(clock.elapsedTime * 3.2));
  for (const s of focusMatSaved) if (s.m.emissive) s.m.emissiveIntensity = k;
}

// ====== 透明显示（三档循环） ======
function cycleTransparency() {
  transMode = (transMode + 1) % 3;
  const b = document.getElementById('btn-trans');
  b.textContent = ['透明显示: 关', '透明显示: 柜体35%', '透明显示: 除束流晶圆外30%'][transMode];
  applyTransparency();
}

function applyTransparency() {
  // 单件聚焦期间幽灵态优先，避免透明档覆盖
  if (focusPart) return;
  // 收集所有需要处理的网格（模型 + 程序化扩容环境）
  const targets = allMeshes.slice();
  if (addEnvGroup) addEnvGroup.traverse(o => { if (o.isMesh) targets.push(o); });

  for (const o of targets) {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    const name = o.name || '';
    const isBeam = BEAM_RE.test(name);
    const isWafer = WAFER_RE.test(name);
    const isEnclosure = ENCLOSURE_RE.test(name);

    let opacity = 1.0;
    if (transMode === 1) {
      // 柜体半透明 35%
      opacity = isEnclosure ? 0.35 : 1.0;
    } else if (transMode === 2) {
      // 除束流与晶圆外全部 30%
      opacity = (isBeam || isWafer) ? 1.0 : 0.30;
    }

    for (const m of mats) {
      if (!m) continue;
      m.transparent = opacity < 1.0;
      m.opacity = opacity;
      m.depthWrite = opacity >= 1.0;
      m.needsUpdate = true;
    }
  }
}

  controls.minDistance = 0.8;
  if (screenUI && screenUI.setOperating) { try { screenUI.setOperating(false); } catch (e) {} }
  animateCamera(camHome, targetHome);

function animateCamera(toPos, toTarget) {
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const t0 = performance.now();
  const dur = 600;
  function step() {
    const t = Math.min((performance.now() - t0) / dur, 1);
    const e = t * t * (3 - 2 * t);
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

      for (const e of beamMeshes) {
        const mt = e.mesh && e.mesh.material;
        const arr = Array.isArray(mt) ? mt : [mt];
        const lit = arr.some(m => m && m.emissive && m.emissiveIntensity > 0.05 && (m.emissive.r + m.emissive.g + m.emissive.b) > 0.01);
        if (lit) litBeams++; else darkBeams.push(e.mesh ? e.mesh.name : '?');
        if (e.mesh && e.mesh.visible) visBeams++;
      }
      rep.beamGlow = { total: beamMeshes.length, lit: litBeams, visible: visBeams, dark: darkBeams.length };
      // 取一个非束流材质的代表样本，检查去色压暗是否真的改色
      const sample = collectRenderMeshes().find(o => o.name === 'ShellDoorL') ||
                     collectRenderMeshes().find(o => !BEAM_RE.test(o.name || ''));
      const sm = sample && sample.material ? (Array.isArray(sample.material) ? sample.material[0] : sample.material) : null;
      const cBefore = sm && sm.color ? sm.color.getHexString() : null;
      setBeamFocus(true);
      let litFocus = 0, visFocus = 0;
      for (const e of beamMeshes) {
        const mt = e.mesh && e.mesh.material;
        const arr = Array.isArray(mt) ? mt : [mt];
        if (arr.some(m => m && m.emissive && m.emissiveIntensity > 0.05)) litFocus++;
        if (e.mesh && e.mesh.visible) visFocus++;
      }
      rep.beamGlowFocus = { lit: litFocus, visible: visFocus, total: beamMeshes.length };
      const cAfter = sm && sm.color ? sm.color.getHexString() : null;
      let tot = 0, changed = 0;
      for (const [m, s] of desatSaved) {
        tot++;
        if (m.color && s.c && m.color.getHexString() !== s.c.getHexString()) changed++;
      }
      rep.beamFocus = {
        on: beamFocus, mats: tot, colorChanged: changed,
        sample: sample ? sample.name : null, cBefore: cBefore, cAfter: cAfter,
        particles: beamParticles ? beamParticles.points.visible : false,
      };
      const b0 = beamParticles ? Array.from(beamParticles.geo.attributes.position.array.slice(0, 3)) : null;
      updateBeamParticles(0.37);
      const b1 = beamParticles ? Array.from(beamParticles.geo.attributes.position.array.slice(0, 3)) : null;
      rep.particlesMoved = !!(b0 && b1 && (Math.abs(b0[0] - b1[0]) > 1e-5 || Math.abs(b0[2] - b1[2]) > 1e-5));
      const send = (tag) => { try { new Image().src = '/_probe_fx/' + tag + '|' + encodeURIComponent(JSON.stringify(rep)); } catch (_) {} };
      send('s1_beam');

      // ⑥ 单件聚焦
      const part = partGroups['PART_TARGET'] || Object.values(partGroups)[0];
      enterFocus(part);
      let ghost = 0;
      for (const o of collectRenderMeshes()) {
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of ms) if (m && m.userData.ghostOrig && Math.abs(m.opacity - 0.08) < 1e-6) ghost++;
      }
      rep.focus = {
        part: part ? part.name : null, ghostMats: ghost,
        breathMats: focusMatSaved.length, planDist: window.__lastFocusDist,
        hint: (document.getElementById('focus-hint') || {}).style ? document.getElementById('focus-hint').style.display : 'removed',
      };
      send('s2_focus');
      // ⑤ 环境动画（用真实时间推进，避免 clock.elapsedTime 不变）
      rep.env = { agv: !!envAnim, workers: envAnim ? envAnim.workers.length : 0, visible: !!(addEnvGroup && addEnvGroup.visible) };
      const a0 = envAnim ? envAnim.agv.group.position.clone() : null;
      const w0 = envAnim ? envAnim.workers[0].group.position.clone() : null;
      const leg0 = envAnim ? envAnim.workers[0].legL.rotation.x : null;
      for (let i = 0; i < 20; i++) updateEnvAnim(0.05);
      const a1 = envAnim ? envAnim.agv.group.position.clone() : null;
      const w1 = envAnim ? envAnim.workers[0].group.position.clone() : null;
      const leg1 = envAnim ? envAnim.workers[0].legL.rotation.x : null;
      rep.env.agvMoved = !!(a0 && a1 && a0.distanceTo(a1) > 0.01);
      rep.env.workerMoved = !!(w0 && w1 && w0.distanceTo(w1) > 0.005);
      rep.env.legSwing = !!(leg0 !== null && leg1 !== null && Math.abs(leg0 - leg1) > 0.01);
      rep.env.agvPos = a1 ? a1.toArray().map(v => +v.toFixed(2)) : null;
      rep.env.beacon = envAnim && envAnim.beaconDome ? +envAnim.beaconDome.material.emissiveIntensity.toFixed(2) : null;
      send('s3_env');

      // ①C 镜头跟随（单独 try，避免整段探针因一处失败而无回传）
      exitFocus(true);
      setBeamFocus(false);
      try {
        const c0 = camera.position.clone();
        followOn = true;
        startBeamFollow();
        for (let i = 0; i < 40; i++) updateBeamFollow(1 / 30);
        rep.follow = {
          moved: camera.position.distanceTo(c0) > 0.05,
          cam: camera.position.toArray().map(v => +v.toFixed(2)),
          controlsDisabled: controls.enabled === false,
        };
        stopBeamFollow(true, true);
        rep.afterInit = {
          ghostCleared: collectRenderMeshes().every(o => {
            const ms = Array.isArray(o.material) ? o.material : [o.material];
            return ms.every(m => !m || !m.userData.ghostOrig);
          }),
          controlsEnabled: controls.enabled === true,
          focusPartNull: focusPart === null,
          beamColorRestored: sm && sm.color ? sm.color.getHexString() === cBefore : null,
        };
      } catch (e) {
        rep.follow = { error: String((e && e.stack) || e).slice(0, 240) };
      }
      send('s4_follow');
      // ⑤-2 设备工程师（检修可视化）：走过去 → 作业 → 离开
      try {
        const e0 = ensureEngineer();
        const wasVisible = e0.visible;
        startEngineer('in');
        const p0 = e0.position.clone();
        for (let i = 0; i < 40; i++) updateEngineer(1 / 30);
        const p1 = e0.position.clone();
        const inWork = (engState === 'work' || engState === 'in');
        startEngineer('off');
        for (let i = 0; i < 3; i++) updateEngineer(1 / 30);
        rep.engineer = {
          created: !!e0, visibleWhenCalled: e0.visible === false ? 'hidden-after-off' : 'visible',
          walked: p0.distanceTo(p1) > 0.2, from: p0.toArray().map(v => +v.toFixed(2)),
          to: p1.toArray().map(v => +v.toFixed(2)), inWork: inWork, wasVisible: wasVisible,
          hiddenAfterLeave: e0.visible === false,
        };
      } catch (e) { rep.engineer = { error: String((e && e.stack) || e).slice(0, 200) }; }
      // ⑤-3 晶圆自发光高亮（光环已按反馈删除）
      try {
        const wm = waferMeshes[0];
        const mt0 = wm && wm.material ? (Array.isArray(wm.material) ? wm.material[0] : wm.material) : null;
        for (let i = 0; i < 5; i++) updateWaferHighlight(1 / 30);
        rep.waferHL = {
          meshes: waferMeshes.length,
          ringRemoved: !scene.getObjectByName('WaferHighlightRing'),
          emissive: mt0 && mt0.emissive ? mt0.emissive.getHexString() : null,
          intensity: mt0 ? +(+mt0.emissiveIntensity || 0).toFixed(2) : null,
        };
      } catch (e) { rep.waferHL = { error: String((e && e.stack) || e).slice(0, 200) }; }
      await sleepMs(200);
      rep.afterInit = {
        ghostCleared: collectRenderMeshes().every(o => {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          return ms.every(m => !m || !m.userData.ghostOrig);
        }),
        controlsEnabled: controls.enabled === true,
        focusPartNull: focusPart === null,
        beamColorRestored: sm && sm.color ? sm.color.getHexString() === cBefore : null,
      };
      new Image().src = '/_probe_fx/final|' + encodeURIComponent(JSON.stringify(rep));
    } catch (e) {
      new Image().src = '/_probe_fx/ERR_' + encodeURIComponent(String((e && e.stack) || e));
    }
  }, 6500);
}

let screenTickT = 0;
let screenDemo = null;
let screenUI = null;

// 屏幕操作页按钮 → 页面既有逻辑
function screenActions() {
  return {
    tune: () => doTune(),
    pilot: () => runPilot(),
    retune: () => retuneBeam(),
    beam: () => toggleBeam(),
    process: () => {
      if (!processRunning && !pilotPassed) {
        showToast('⚠ 未试片或试片不合格：请先点「🧪 试片」');
        return;
      }
      toggleProcess();
    },
    fast: () => toggleFastDemo(),
    repair: () => callEngineer(),
    confirmwarn: () => confirmWarn(),
    adjustparam: () => adjustParam(),
    ack: () => confirmWarn(),
    pause: () => togglePause(),
    reload: () => reloadBox(),
  };
}
/* 本盒进度与预计时间：供屏幕「工艺汇总」显示
   perWafer = 每片真实秒数 = 动画周期 17.5 s ÷ 当前时间轴倍速(1.5 或 8)
   预计剩余 = (剩余片数 - 当前片已走比例) × perWafer；暂停/宕机/报警拦截时不推进 */
function lotProgress() {
  const ts = (mixer && mixer.timeScale > 0.01) ? mixer.timeScale : 1.5;
  const perWafer = CYCLE_S / ts;
  const done = Math.min(lotCycle.done || 0, lotCycle.total || 20);
  const total = lotCycle.total || 20;
  const left = Math.max(0, total - done);
  const running = processRunning && !processPaused && !machineDown && !warnInfo && ts > 0.01;
  let frac = 0;
  if (running && left > 0) {
    const tIn = ((mixer.time % CYCLE_S) + CYCLE_S) % CYCLE_S;
    frac = Math.min(1, tIn / CYCLE_S);
  }
  const etaSec = Math.max(0, (left - frac) * perWafer);
  const hold = machineDown ? '机台宕机'
    : (warnInfo ? '报警拦截（待调参）'
      : (processPaused ? '工艺已暂停'
        : (!processRunning ? '工艺未启动' : '')));
  let clock = '';
  if (etaSec > 0) {
    const t = new Date(Date.now() + etaSec * 1000);
    clock = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
  }
  return {
    lotId: currentLotId, done, total, left,
    pct: Math.round(done / Math.max(1, total) * 100),
    perWafer: Math.round(perWafer * 10) / 10,
    etaSec: Math.round(etaSec), clock, hold, fast: !!lotCycle.fast,
  };
}

function screenState() {
  return {
    power: powerOn, tuneDone: tuneDone, pilotPassed: pilotPassed, pilotInfo: pilotInfo,
    pilotBusy: pilotBusy, processRunning: processRunning, beamOn: beamOn,
    processPaused: processPaused, warnInfo: warnInfo, ackBusy: ackBusy,
    pendingParam: pendingParam,
    machineDown: machineDown, downReason: downReason, repairPhase: repairPhase,
    repairBusy: repairBusy,
    fast: lotCycle.fast, cycle: lotCycle,
    lot: lotProgress(),
    lotReport: lotReport,
  };
}

// ====== 屏幕验收探针（?probe=screen）：页签/按钮/记录桥接 ======
async function runScreenTest() {
  const rep = {};
  try {
    for (let i = 0; i < 40 && !screenUI; i++) await new Promise(r => setTimeout(r, 250));
    rep.screen_ready = !!screenUI;
    if (!screenUI) throw new Error('screenUI 未就绪');
    rep.overlay = !!screenUI.overlay;
    rep.mode = screenUI.mode;
    const ov = screenUI.overlay;
    rep.tabs = ov.querySelectorAll('[data-page]').length;
    rep.buttons = ov.querySelectorAll('[data-act]').length;

    // 1) 关闭态（贴图）：HTML 层 opacity=0，贴图可见
    screenUI.setOperating(false); screenUI.update(null);
    rep.closed_opacity = ov.style.opacity;
    rep.closed_plane_visible = screenUI.plane ? screenUI.plane.visible : null;

    // 2) 进入操作态
    screenUI.setOperating(true); screenUI.setPage('act'); screenUI.update(null);
    rep.open_opacity = ov.style.opacity;
    rep.open_page = screenUI.getPage();
    rep.act_page_has_pilot = !!ov.querySelector('[data-act="pilot"]');

    // 3) 切页 + 逐页验证“屏幕里真的有数据”
    rep.pages = {};
    for (const pg of ['wafer', 'param', 'sum', 'act']) {
      screenUI.setPage(pg); screenUI.update(null);
      const on = ov.querySelector('[data-page].on');
      rep['page_' + pg] = on ? on.dataset.page : null;
      const txt = (ov.textContent || '');
      rep.pages[pg] = {
        rows: ov.querySelectorAll('.sw-tbl tbody tr').length,
        cells: ov.querySelectorAll('.sw-tbl tbody td').length,
        dashes: (txt.match(/—/g) || []).length,
        digits: (txt.match(/\d/g) || []).length,
        head: txt.replace(/\s+/g, ' ').slice(0, 90),
      };
    }
    rep.pages_checked = 4;
    rep.kpi_cells = ov.querySelectorAll('.sw-kpi b').length || ov.querySelectorAll('.sw-kpi').length;

    // 3b) 几何证据：四角投影 + 覆盖层包围盒（确认叠在屏幕位置上、比例正确）
    try {
      const cp = screenUI.corners.map(c => {
        const v = c.clone().project(camera);
        return [Math.round((v.x * 0.5 + 0.5) * innerWidth), Math.round((-v.y * 0.5 + 0.5) * innerHeight)];
      });
      rep.corners_px = cp;
      const area = Math.abs((cp[1][0] - cp[0][0]) * (cp[2][1] - cp[0][1]) - (cp[2][0] - cp[0][0]) * (cp[1][1] - cp[0][1]));
      rep.quad_area_px = Math.round(area);
      rep.quad_w = Math.abs(cp[1][0] - cp[0][0]);
      rep.quad_h = Math.abs(cp[3][1] - cp[0][1]);
      rep.aspect = +(rep.quad_w / Math.max(rep.quad_h, 1)).toFixed(2);
      const br = ov.getBoundingClientRect();
      rep.overlay_box = [Math.round(br.left), Math.round(br.top), Math.round(br.width), Math.round(br.height)];
      rep.overlay_visible = getComputedStyle(ov).opacity;
      rep.overlay_text_sample = (ov.querySelector('.sw-title') || {}).textContent || '';
      rep.overlay_table_rows = ov.querySelectorAll('.sw-tbl tbody tr').length;
    } catch (e) { rep.geom_err = String(e); }

    // 4) 屏幕内点「试片」按钮 → 走真实 API
    pilotInfo = null; pilotPassed = false;
    if (!powerOn) { if (doorL) doorL.position.x = DOOR_L_CLOSED; if (doorR) doorR.position.x = DOOR_R_CLOSED; togglePower(); }
    screenUI.update(null);
    const bp = ov.querySelector('[data-act="pilot"]');
    bp.click();
    await new Promise(r => setTimeout(r, 2500));
    rep.pilot_via_screen = pilotInfo ? { pass: pilotInfo.pass, uf: pilotInfo.uniformity } : null;

    // 5) 屏幕内点「启动工艺」（试片不合格时应被拦）
    let bpr = ov.querySelector('[data-act="process"]');
    bpr.click();
    await new Promise(r => setTimeout(r, 400));
    rep.process_via_screen = processRunning;
    if (!processRunning) rep.process_block_reason =
      (!powerOn ? 'power-off' : (!doorsClosed() ? 'doors-open' : (!mixerReady ? 'mixer-not-ready' : 'blocked-by-pilot')));
    // 6) 再点一次应停止
    screenUI.setPage('act'); screenUI.update(null);
    bpr = ov.querySelector('[data-act="process"]');
    bpr.click();
    await new Promise(r => setTimeout(r, 400));
    rep.process_stopped_via_screen = (processRunning === false);
    // 6) 情形四：四个页签按钮均已绑定（点击不抛错）
    rep.tab_clicks = [];
    for (const pg of ['wafer', 'param', 'sum', 'act']) {
      const b = ov.querySelector('[data-page="' + pg + '"]');
      if (b) { b.click(); rep.tab_clicks.push(ov.querySelector('[data-page].on').dataset.page); }
    }

    // 7) 点屏幕 → 相机推近后，四角应显著变大（可读性）
    const before = rep.quad_w || 0;
    showPcPanel();
    await new Promise(r => setTimeout(r, 2200));
    const cp2 = screenUI.corners.map(c => {
      const v = c.clone().project(camera);
      return [Math.round((v.x * 0.5 + 0.5) * innerWidth), Math.round((-v.y * 0.5 + 0.5) * innerHeight)];
    });
    rep.zoom_quad_w = Math.abs(cp2[1][0] - cp2[0][0]);
    rep.zoom_grew = rep.zoom_quad_w > before + 40;
    rep.zoom_operating = screenUI.isOperating();
    rep.zoom_page = screenUI.getPage();
  } catch (e) { rep.error = String(e); }
  new Image().src = '/_screentest/' + encodeURIComponent(JSON.stringify(rep));
}

  const wantFar = qs.get('screendist') === 'far';   // 远景：不推镜，按默认取景看真实像素

  const size = box.getSize(new THREE.Vector3());
  const fill = 0.72;
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const dist = (size.x / fill) / (2 * Math.tan(fov / 2) * camera.aspect);

    controls.minDistance = 0.06;
    camera.position.set(ctr.x, ctr.y, ctr.z + dist);

      op = v;
      screenDemo.setOperating(v);
      btn.textContent = v ? '退出操作态（回到贴图）' : '进入操作态（HTML 层）';
      btn.style.color = v ? '#2ee6a0' : '#4dc3ff';
      btn.style.borderColor = v ? '#2ee6a0' : '#4dc3ff';
    };
    btn.onclick = () => apply(!op);
    document.body.appendChild(btn);
    apply(op);
    // 相机靠近屏幕（<0.35m）自动进入操作态
    setInterval(() => {
      const d2 = camera.position.distanceTo(ctr);
      if (!op && d2 < 0.35) apply(true);
    }, 500);
  }

  let dataTimer = null;
  async function refresh() {
    const m = await mod.dashboardModel();
    screenDemo.update(m);
  }
  refresh();
  dataTimer = setInterval(refresh, 4000);
  window.__screenDemo = () => ({
    mode, screenPx: [pxW, pxH], mesh: pcScreen.name,
    cornersPx: screenDemo.corners.map(c => {
      const v = c.clone().project(camera);
      return [Math.round((v.x * 0.5 + 0.5) * innerWidth), Math.round((-v.y * 0.5 + 0.5) * innerHeight)];
    }),
  });
  console.log('screendemo ready', mode, pxW, pxH);
  // 自检回传：方案 / 屏幕像素 / 四角屏幕坐标（404 请求写进服务端日志）
  setTimeout(() => {
    try {
      const info = window.__screenDemo();
      info.wantFar = wantFar; info.pxNow = [pxWnow, pxHnow];
      info.operating = screenDemo.isOperating ? screenDemo.isOperating() : null;
      new Image().src = '/_screendemo/' + encodeURIComponent(JSON.stringify(info));
    } catch (e) { new Image().src = '/_screendemo/ERR_' + encodeURIComponent(String(e)); }
  }, 1500);
}

// ====== 过场动画（20-25s：机台外观→去壳核心→工程师→LOGO 浮现） ======
let introActive = false;
function playIntroAnimation() {
  const overlay = document.getElementById('intro-overlay');
  const cap = document.getElementById('intro-cap');
  const pf = document.getElementById('intro-pf');
  const logo = document.getElementById('intro-logo');
  const skipBtn = document.getElementById('intro-skip-btn');
  if (!overlay) return;

  // URL 参数 ?nointro=1 跳过过场（探针/调试用）
  if (urlParams.get('nointro') === '1') {
    overlay.style.display = 'none';
    return;
  }

  introActive = true;
  // 隐藏主 UI
  const uiEls = ['#header', '#kpi-panel', '#controls', '#nav-hint', '#power-status', '#process-status', '#pilot-status'];
  uiEls.forEach(sel => { const el = document.querySelector(sel); if (el) el.style.opacity = '0'; });

  const phases = [
    { dur: 8, label: '佳芯科技 · IMP-MC-01 中束流离子注入机', action: 'orbit' },
    { dur: 7, label: '核心工艺系统 · 离子源 / 分析磁铁 / 加速管 / 靶室', action: 'interior' },
    { dur: 10, label: '设备工程师 EE-01 · 检修就绪', action: 'engineer' },
    { dur: 8, label: '', action: 'logo' },
  ];
  const totalDur = phases.reduce((s, p) => s + p.dur, 0);
  const t0 = performance.now();
  let ended = false;

  function endIntro() {
    if (ended) return;
    ended = true;
    introActive = false;
    shellTarget = 0;
    if (typeof engineer !== 'undefined' && engineer) {
      engineer.visible = false;
      const u = engineer.userData;
      if (u) { u.torso.rotation.x=0; u.legL.rotation.x=0; u.legR.rotation.x=0; u.armL.rotation.x=0; u.armR.rotation.x=0;
               if(u.calfL)u.calfL.rotation.x=0; if(u.calfR)u.calfR.rotation.x=0; if(u.foreL)u.foreL.rotation.x=0; if(u.foreR)u.foreR.rotation.x=0;
               u.cap.position.y=0.50; }
      engineer.position.y = 0;
    }
    camera.position.copy(camHome);
    controls.target.copy(targetHome);
    controls.update();
    uiEls.forEach(sel => { const el = document.querySelector(sel); if (el) el.style.opacity = ''; });
    overlay.classList.add('fade-out');
    setTimeout(() => { overlay.style.display = 'none'; }, 1200);
  }

  skipBtn.addEventListener('click', endIntro);

  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(t) { return t * t * (3 - 2 * t); }

  function updateIntro() {
    if (!introActive) return;
    const elapsed = (performance.now() - t0) / 1000;
    pf.style.width = Math.min(100, elapsed / totalDur * 100) + '%';

    let cum = 0, curPhase = 0, phaseT = 0;
    for (let i = 0; i < phases.length; i++) {
      if (elapsed < cum + phases[i].dur) { curPhase = i; phaseT = (elapsed - cum) / phases[i].dur; break; }
      cum += phases[i].dur;
    }
    const p = phases[curPhase];
    const st = smoothstep(phaseT);

    if (p.action === 'orbit') {
      // 阶段一：环绕机台一整圈（360°），结束点面向机台大门（+Z 方向）
      const angle = Math.PI / 2 + phaseT * Math.PI * 2;
      const r = 6.5, h = 3.8;
      camera.position.set(Math.cos(angle) * r, h, Math.sin(angle) * r);
      controls.target.set(0, 1.2, 0);
      cap.textContent = p.label;
      cap.classList.add('show');
    } else if (p.action === 'interior') {
      // 触发外壳打开
      if (phaseT < 0.1 && shellTarget === 0) shellTarget = 1;
      // 相机从阶段一结束点(0,3.8,6.5)向机台内部推进（与阶段一结束位置一致）
      camera.position.set(lerp(0, 0.3, st), lerp(3.8, 1.0, st), lerp(6.5, 0.5, st));
      controls.target.set(0, 0.6, 0);
      cap.textContent = p.label;
    } else if (p.action === 'engineer') {
      // 阶段三（10s）：正面特写 → 转向 → 走入机台 → 蹲下检修4s → 站起
      if (phaseT < 0.05) {
        ensureEngineer();
        if (engineer) {
          engineer.visible = true;
          engineer.position.set(0, 0, 2.0); // 警戒线外
          engineer.rotation.y = 0; // 背对机台（面朝+Z）
        }
        if (typeof engState !== 'undefined') engState = 'off';
      }
      if (phaseT < 0.20) {
        // 段A（2s）：正面特写（工程师背对机台，摄像机在工程师前方）
        const t2 = phaseT / 0.20;
        camera.position.set(0, lerp(0.9, 0.7, smoothstep(t2)), lerp(3.0, 2.5, smoothstep(t2)));
        controls.target.set(0, 0.5, 2.0);
        cap.textContent = '设备工程师 EE-01 · 检修就绪';
      } else if (phaseT < 0.25) {
        // 段B（0.5s）：工程师转向（从背对机台转向面向机台）
        const t2 = (phaseT - 0.20) / 0.05;
        if (engineer) engineer.rotation.y = lerp(0, Math.PI, smoothstep(t2));
        camera.position.set(0, 0.7, 2.5);
        controls.target.set(0, 0.5, 2.0);
      } else if (phaseT < 0.50) {
        // 段C（2.5s）：摄像机从后上方偏右跟随工程师走到大门并进入机台
        const t2 = (phaseT - 0.25) / 0.25;
        const st2 = smoothstep(t2);
        const engZ = lerp(2.0, 0.15, st2);
        if (engineer) {
          engineer.position.set(0, 0, engZ);
          engineer.rotation.y = Math.PI;
        }
        camera.position.set(0.3, lerp(1.0, 0.9, st2), engZ + 0.5);
        controls.target.set(0, 0.5, engZ);
        cap.textContent = 'EE-01 进入机台内部检修…';
      } else if (phaseT < 0.90) {
        // 段D（4s）：蹲下检修动画
        const t2 = (phaseT - 0.50) / 0.40;
        const enterSquat = Math.min(1, t2 * 3); // 前 1/3 时间蹲下
        const s = Math.sin(performance.now() / 1000 * 3.2);
        if (engineer) {
          engineer.position.set(0, -0.08 * smoothstep(enterSquat), 0.15);
          engineer.rotation.y = Math.PI;
          const u = engineer.userData;
          if (u) {
            u.torso.rotation.x = 0.35 * smoothstep(enterSquat) + s * 0.05;
            u.legL.rotation.x = 0.85 * smoothstep(enterSquat);
            u.legR.rotation.x = 0.85 * smoothstep(enterSquat);
            if (u.calfL) u.calfL.rotation.x = -1.2 * smoothstep(enterSquat);
            if (u.calfR) u.calfR.rotation.x = -1.2 * smoothstep(enterSquat);
            u.armR.rotation.x = -1.35 * smoothstep(enterSquat) + s * 0.35;
            u.armL.rotation.x = -0.75 * smoothstep(enterSquat) + s * 0.22;
            if (u.foreR) u.foreR.rotation.x = 0.40 + Math.abs(s) * 0.20;
            if (u.foreL) u.foreL.rotation.x = 0.30 + Math.abs(s) * 0.15;
            u.cap.position.y = 0.50 - 0.08 * smoothstep(enterSquat);
          }
        }
        camera.position.set(0.4, 0.95, 0.7);
        controls.target.set(0, 0.35, 0.15);
        cap.textContent = 'EE-01 蹲下检修中（开腔 / 更换模块 / 复位联锁）…';
      } else {
        // 段E（1s）：站起
        const t2 = (phaseT - 0.90) / 0.10;
        const st2 = smoothstep(t2);
        if (engineer) {
          engineer.position.set(0, lerp(-0.08, 0, st2), 0.15);
          const u = engineer.userData;
          if (u) {
            u.torso.rotation.x = lerp(0.35, 0, st2);
            u.legL.rotation.x = lerp(0.85, 0, st2);
            u.legR.rotation.x = lerp(0.85, 0, st2);
            if (u.calfL) u.calfL.rotation.x = lerp(-1.2, 0, st2);
            if (u.calfR) u.calfR.rotation.x = lerp(-1.2, 0, st2);
            u.armR.rotation.x = lerp(-1.35, 0, st2);
            u.armL.rotation.x = lerp(-0.75, 0, st2);
            if (u.foreR) u.foreR.rotation.x = lerp(0.40, 0, st2);
            if (u.foreL) u.foreL.rotation.x = lerp(0.30, 0, st2);
            u.cap.position.y = lerp(0.42, 0.50, st2);
          }
        }
        camera.position.set(lerp(0.4, 0.3, st2), lerp(0.95, 1.0, st2), lerp(0.7, 0.5, st2));
        controls.target.set(0, lerp(0.35, 0.5, st2), 0.15);
      }
    } else if (p.action === 'logo') {
      // LOGO 浮现（8s），镜头从机台内部拉远到默认机位
      if (phaseT < 0.05) {
        cap.classList.remove('show');
        logo.classList.add('show');
        logo.style.transform = 'scale(0.3)';
        logo.style.opacity = '0';
        // 关闭外壳，隐藏工程师
        shellTarget = 0;
        if (engineer) {
          engineer.visible = false;
          const u = engineer.userData;
          if (u) { u.torso.rotation.x=0; u.legL.rotation.x=0; u.legR.rotation.x=0; u.armL.rotation.x=0; u.armR.rotation.x=0;
                   if(u.calfL)u.calfL.rotation.x=0; if(u.calfR)u.calfR.rotation.x=0; if(u.foreL)u.foreL.rotation.x=0; if(u.foreR)u.foreR.rotation.x=0;
                   u.cap.position.y=0.50; }
          engineer.position.y = 0;
        }
      }
      // LOGO 从 0.3 放大到 1.3（比之前更大）
      const logoScale = 0.3 + smoothstep(Math.min(1, phaseT * 2)) * 1.0;
      logo.style.transform = 'scale(' + logoScale.toFixed(2) + ')';
      logo.style.opacity = smoothstep(Math.min(1, phaseT * 1.5)).toFixed(2);
      // 相机缓慢拉远到 camHome=(9,6,10)
      camera.position.lerp(camHome, 0.04);
      controls.target.lerp(targetHome, 0.04);
    }

    controls.update();
    renderer.render(scene, camera);

    if (elapsed >= totalDur) { endIntro(); return; }
    requestAnimationFrame(updateIntro);
  }
  updateIntro();
}

// ====== 渲染循环 ======
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  updateWASD(delta);          // WASD 自由平移（单件聚焦/镜头跟随时仍可用）
  if (mixer) mixer.update(delta);

  // 屏幕 UI 每帧重投影（相机一动 DOM 层就跟着贴住屏面）
  if (screenDemo) screenDemo.update();

  // 外壳动画插值（新版模型是滑行门 + 顶盖，用平移而非铰链旋转）
  if (shellProgress !== shellTarget) {
    shellProgress += (shellTarget - shellProgress) * 0.06;
    if (Math.abs(shellProgress - shellTarget) < 0.001) shellProgress = shellTarget;
    const e = shellProgress;
    // 直接驱动门网格（旧代码只动空对象 pivot → 门纹丝不动）
    if (doorL) doorL.position.x = DOOR_L_CLOSED + e * (DOOR_L_OPEN - DOOR_L_CLOSED);
    if (doorR) doorR.position.x = DOOR_R_CLOSED + e * (DOOR_R_OPEN - DOOR_R_CLOSED);
  }

  // 更新描边位置（跟随部件）
  function syncOutline(ol) {
    if (!ol) return;
    ol.children.forEach((line, i) => {
      // outline 在创建时已固定位置，但如果部件移动（如门打开），需要同步
      // 这里简单处理：不重新同步（静态模型）
    });
  }

  // 按「片」推进计数（从 animate() 抽出，便于探针直接调用同一公式）
  function syncCycleCount() {
    if (!processRunning || !mixer) return;
    const cyc = Math.floor(mixer.time / CYCLE_S + 1e-6);
    if (cyc <= lastCycleIdx) return;
    lastCycleIdx = cyc;
    if (lotCycle.active) {
      lotCycle.done = Math.min(cyc, lotCycle.total);
      if (lotCycle.done >= lotCycle.total) {
        emitWafer(lotCycle.done);      // 最后一片也要落库（DB 与动画 1:1）
        finishLotCycle();
      } else {
        emitWafer(lotCycle.done);      // 每走完 1 片才让模拟器产出这 1 片
        showToast('✔ 第 ' + lotCycle.done + '/' + lotCycle.total + ' 片完成');
      }
    } else if (cyc >= 1) {
      stopProcess(true);
      showToast('✔ 一轮工艺完成（传片→注入→取片）');
    }
  }
  window.__syncCycleCount = syncCycleCount;

  // ===== 工艺结束检测（一盒 20 片：按「片」计数，走完整盒自动停机）=====
  syncCycleCount();

  // ===== 束流脉冲（按片循环：每片 7.5–11.67 s 为注入窗口）=====
  if (mixer) {
    const t = mixer.time % CYCLE_S;
    const inWindow = t >= 7.5 && t <= 11.67;
    const active = processRunning && beamOn && inWindow;
    beamMeshes.forEach((entry, i) => {
      if (active) {
        const phase = (t - 7.5) * 24 + i * 4;   // 帧数 + 相位延迟
        const pulse = Math.sin(phase * Math.PI / 4);
        entry.mat.emissiveIntensity = entry.baseIntensity * (2.0 + pulse * 1.5);
      } else {
        entry.mat.emissiveIntensity = 0;
      }
    });
  }

  // ===== 配电柜：柜门开合插值 + 高压危险灯箱呼吸 =====
  if (powerCabinet) {
    if (Math.abs(cabinetDoorOpen - cabinetDoorTarget) > 0.001) {
      cabinetDoorOpen += (cabinetDoorTarget - cabinetDoorOpen) * Math.min(1, delta * 6);
      powerCabinet.doorPivot.rotation.y = -cabinetDoorOpen * (Math.PI * 0.62);
    }
    if (powerOn && hazardTextMats.length) {
      const breath = 2.2 + Math.sin(clock.elapsedTime * 2.2) * 0.55;
      for (const m of hazardTextMats) m.emissiveIntensity = breath;
    }
  }

  // ===== 更新数据卡位置 =====
  updateDataCardPosition();

  // ===== ①B 束流粒子 / ①C 镜头跟随 / ⑥ 聚焦呼吸 =====
  updateBeamParticles(delta);
  updateBeamFollow(delta);
  updateFocusBreath();
  updateEnvAnim(delta);
  updateEngineer(delta);
  updateWaferHighlight(delta);
  updateTowerLight();
  updateAGV(delta);

  // ===== 操作电脑屏幕覆盖层跟随相机（限频 10Hz，够跟手）=====
  if (screenUI) {
    screenTickT = (screenTickT || 0) + delta;
    if (screenTickT > 0.1) { screenTickT = 0; try { screenUI.update(null); } catch (e) {} }
  }

  if (!introActive) controls.update();
  // ?lite=1：无头验收时不发绘制指令（只跑状态机与场景图，规避 SwiftShader 帧压过大导致的整页假死）
  // introActive 时由 updateIntro() 自己渲染
  if (!LITE && !introActive) renderer.render(scene, camera);

  // ===== FPS 计数器 =====
  _fpsCount++;
  const _now = performance.now();
  if (_now - _fpsLastT >= 1000) {
    const fps = Math.round(_fpsCount * 1000 / (_now - _fpsLastT));
    if (_fpsEl) _fpsEl.textContent = fps + ' FPS';
    _fpsCount = 0; _fpsLastT = _now;
  }
}
const LITE = urlParams.get('lite') === '1';
var _fpsCount = 0, _fpsLastT = 0;
const _fpsEl = document.createElement('div');
_fpsEl.style.cssText = 'position:fixed;bottom:8px;left:8px;z-index:9998;font:11px monospace;color:#7C9CC4;background:rgba(11,19,34,0.6);padding:2px 8px;border-radius:6px;pointer-events:none;';
document.body.appendChild(_fpsEl);
animate();

// ====== 窗口尺寸 ======
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ====== 全局函数（供 onclick 调用） ======
window.toggleShell = toggleShell;
window.toggleEnv = toggleEnv;
window.resetCamera = resetCamera;
window.togglePower = togglePower;
window.toggleProcess = toggleProcess;
window.toggleBeam = toggleBeam;
window.toggleAddEnv = toggleAddEnv;
window.cycleTransparency = cycleTransparency;
window.toggleBeamFocus = toggleBeamFocus;
window.toggleFollow = toggleFollow;
window.runPilot = runPilot;
window.retuneBeam = retuneBeam;
window.toggleFastDemo = toggleFastDemo;
window.toggleLotCycle = function () { lotCycle.active = true; lotCycle.done = 0; };
window.finishLotCycle = finishLotCycle;
window.closeStopReport = closeStopReport;
window.getPilotState = function () {
  return {
    power: powerOn, pilotPassed: pilotPassed, pilotInfo: pilotInfo, retuneCount: retuneCount,
    cycle: { active: lotCycle.active, done: lotCycle.done, total: lotCycle.total, fast: lotCycle.fast },
    processRunning: processRunning, report: lotCycle.report
  };
};
window.enterFocus = enterFocus;
window.exitFocus = exitFocus;

// Esc / 点击空白 = 退出单件聚焦
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (focusPart) exitFocus(); else deselectPart(); }
});
